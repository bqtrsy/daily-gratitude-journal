name: Application CI
on: [push, pull_request]
jobs:
  pipeline:
    name: dailyGratitudeJournal pipeline
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40
    env:
      NODE_VERSION: 22.15.0
      SPRING_OUTPUT_ANSI_ENABLED: DETECT
      SPRING_JPA_SHOW_SQL: false
      JHI_DISABLE_WEBPACK_LOGS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node.js packages
        run: npm install

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Start backend server
        run: |
          nohup ./mvnw -Dskip.installnodenpm -Dskip.npm -ntp --batch-mode spring-boot:run &
          npx wait-on http://localhost:8080/management/health

      - name: Run JUnit with JaCoCo
        run: ./mvnw clean test jacoco:report -Dspring.profiles.active=test

      - name: Upload JUnit Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-report
          path: target/site/jacoco/**

      - name: Run Gatling
        run: npm run ci:performance:test

      - name: Upload Gatling Report
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: target/gatling/**

      - name: Run Jest
        run: npm run ci:frontend:test

      - name: Run Spring test with JaCoCo
        run: ./mvnw clean verify -Dspring.profiles.active=test

      - name: Upload Spring Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-test-report
          path: target/site/jacoco/**

      - name: Package application
        run: npm run java:jar:prod

      - name: 'E2E: Package'
        run: npm run ci:e2e:package

      - name: 'E2E: Prepare'
        run: npm run ci:e2e:prepare

      - name: Run Cypress
        run: npm run ci:e2e:run
        env:
          CYPRESS_ENABLE_RECORD: false
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: 'E2E: Teardown'
        run: npm run ci:e2e:teardown
